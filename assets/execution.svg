<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9abd83" stroke-opacity=".05"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="none" stroke="#c4ef8c"/></marker></defs><rect width="1440" height="720" rx="20" fill="#101f23"/><rect width="1440" height="720" fill="url(#grid)"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="60" y="64" fill="#c4ef8c" font-size="14" letter-spacing="3">MODEL FOUNDRY / ENGINEERING EXECUTION</text><text x="60" y="122" fill="#eef4e9" font-size="40" font-weight="700">把一次工程决策，变成可以检查的后果。</text><text x="60" y="164" fill="#9db5ac" font-size="18">数据版本 → 可执行代码 → 训练与检查点 → 评测门槛 → 服务请求</text><g fill="#172e2e" stroke="#3c584c"><rect x="60" y="222" width="300" height="310" rx="10"/><rect x="400" y="222" width="300" height="310" rx="10"/><rect x="740" y="222" width="300" height="310" rx="10"/><rect x="1080" y="222" width="300" height="310" rx="10"/></g><g fill="#c4ef8c" font-size="12" letter-spacing="2"><text x="84" y="259">01 / DATA</text><text x="424" y="259">02 / SOURCE</text><text x="764" y="259">03 / LEARNING</text><text x="1104" y="259">04 / SERVING</text></g><g fill="#eef4e9" font-size="25" font-weight="600"><text x="84" y="304">数据有血缘</text><text x="424" y="304">代码会执行</text><text x="764" y="304">实验有差异</text><text x="1104" y="304">请求有生命周期</text></g><g fill="#a9c0b6" font-size="16"><text x="84" y="354">近似去重 / 污染检查</text><text x="84" y="394">文档簇隔离 / 采样混合</text><text x="84" y="434">EOS / Packing / Loss mask</text><text x="84" y="490" fill="#dcbd87">每条记录都有处理证据</text><text x="424" y="354">Python AST / 模块导入</text><text x="424" y="394">Forward / Loss / 梯度</text><text x="424" y="434">源文件 / 行号 / Traceback</text><text x="424" y="490" fill="#dcbd87">改错代码，就在执行处失败</text><text x="764" y="354">Adam / 学习率 / 梯度裁剪</text><text x="764" y="394">SFT / Reference-policy DPO</text><text x="764" y="434">逐样本评测 / 转换校验</text><text x="764" y="490" fill="#dcbd87">训练损失与验证结果分开看</text><text x="1104" y="354">排队 / Prefill / Decode</text><text x="1104" y="394">KV 租约 / LRU / 取消超时</text><text x="1104" y="434">灰度 / 回滚 / 副本恢复</text><text x="1104" y="490" fill="#dcbd87">版本、缓存与延迟可追溯</text></g><g fill="none" stroke="#9abd83" marker-end="url(#arrow)"><path d="M366 378H390"/><path d="M706 378H730"/><path d="M1046 378H1070"/></g><path d="M60 584H1380" stroke="#3d584b"/><text x="60" y="625" fill="#b8cdbd" font-size="18">共享同一份工程状态</text><text x="60" y="663" fill="#809d91" font-size="15">第一人称现场 · 工具窗口 · 工程终端 · 源代码 · 指标 · 模型资产 · 本地工程存档</text><text x="1250" y="663" fill="#c4ef8c" font-size="13">BUILD 04</text></g></svg>
