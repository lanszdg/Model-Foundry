<g font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif"><text x="64" y="62" fill="#bfe791" font-size="15" letter-spacing="3">MODEL FOUNDRY / ENGINEERING CONTINUITY</text><text x="64" y="126" fill="#edf4ef" font-size="43" font-weight="650">一个模型规格，贯穿整条工程链。</text><text x="64" y="167" fill="#97aeaf" font-size="20">改变结构，追踪每张卡、每个分片、每一次部署的后果。</text>
