<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">一个模型规格，贯穿整条工程链</title><desc id="desc">Atlas 70B 的冻结规格驱动张量清单、逐卡资源、检查点和服务容量，浏览器数值参考验证算子与更新。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e2429"/><stop offset="1" stop-color="#081418"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ab7b4" stroke-opacity=".045"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#bfe791" stroke-width="1.3"/></marker></defs>
