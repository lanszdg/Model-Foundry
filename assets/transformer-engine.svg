<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">Model Foundry 可执行 Transformer</title><desc id="desc">从 Token、注意力、梯度到模型资产与逐步生成的计算闭环。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11292e"/><stop offset="1" stop-color="#07181e"/></linearGradient><linearGradient id="tile" x2="1" y2="1"><stop stop-color="#bce58f"/><stop offset="1" stop-color="#70aaa3"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9fcbc4" stroke-opacity=".045"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8fbbb4"/></marker></defs><rect width="1440" height="720" rx="24" fill="url(#bg)"/><rect width="1440" height="720" rx="24" fill="url(#grid)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="64" y="64" fill="#bbdf97" font-size="13" letter-spacing="3">MODEL FOUNDRY / COMPUTATION ENGINE</text><text x="64" y="128" fill="#eff5ee" font-size="40" font-weight="600">走进模型内部，看见每一次更新。</text><text x="64" y="166" fill="#95b0b2" font-size="18">从损失、梯度与参数，到真实 K/V 张量和下一枚 Token。</text><g fill="#142f35" stroke="#36565a"><rect x="64" y="227" width="184" height="234" rx="14"/><rect x="290" y="227" width="448" height="234" rx="14"/><rect x="780" y="227" width="224" height="234" rx="14"/><rect x="1046" y="227" width="330" height="234" rx="14"/></g><g stroke="#8fbbb4" stroke-width="1.3" marker-end="url(#arrow)"><path d="M250 344H278"/><path d="M740 344H768"/><path d="M1006 344H1034"/></g><g fill="#97b4b6" font-size="12" letter-spacing="2"><text x="88" y="261">01 / INPUT</text><text x="314" y="261">02 / DECODER BLOCK × N</text><text x="804" y="261">03 / OBJECTIVE</text><text x="1070" y="261">04 / OPTIMIZER</text></g><g fill="#edf3ed" font-size="20" font-weight="600"><text x="88" y="304">Token Embedding</text><text x="314" y="304">RMSNorm · RoPE · GQA</text><text x="804" y="304">Logits → NLL</text><text x="1070" y="304">Global batch → AdamW</text></g><g fill="#a1babc" font-size="15"><text x="88" y="351">冻结的 BPE 词表</text><text x="88" y="380">序列与监督遮罩</text><text x="88" y="422">可复现的数据游标</text><text x="314" y="351">Q / K / V → 因果注意力 → 残差</text><text x="314" y="380">RMSNorm → SwiGLU → 残差</text><text x="314" y="422">每个张量都有可追溯的反向梯度</text><text x="804" y="351">Pretrain / SFT</text><text x="804" y="380">Reference-policy DPO</text><text x="804" y="422">稳定交叉熵与偏好损失</text><text x="1070" y="351">梯度累积 / Norm / Clip</text><text x="1070" y="380">一阶矩 / 二阶矩 / 学习率</text><text x="1070" y="422">屏障完整后提交参数</text></g><path d="M1206 469V505H154V468" fill="none" stroke="#b9dd98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="550" y="530" fill="#bedc9d" font-size="13" letter-spacing="1">REVERSE MODE / VERIFIED GRADIENTS</text><rect x="64" y="571" width="1312" height="86" rx="14" fill="url(#tile)"/><text x="88" y="605" fill="#153235" font-size="14" font-weight="600">同一套参数，贯穿训练与交付</text><text x="88" y="634" fill="#153235" font-size="18">Checkpoint + Adam + RNG → safetensors → Prefill K/V → 逐 Token Decode → 保存与继续</text><text x="64" y="690" fill="#6e9094" font-size="12">浏览器数值分配与虚拟 Atlas 70B 的工程资源分别记录。完整计算结构，可检查执行边界。</text></g></svg>
