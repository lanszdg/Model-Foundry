<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">让每一次修改，都进入真实的工程因果链</title><desc id="desc">数据标注、组件选择和精度并行配置进入统一执行约定，训练等待共享链路通信，检查点保留中间状态，评测和部署共同校验执行条件。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10272c"/><stop offset="1" stop-color="#071719"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7caaa4" stroke-opacity=".06"/></pattern></defs>
<rect width="1440" height="780" rx="24" fill="url(#bg)"/><rect width="1440" height="780" rx="24" fill="url(#grid)"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="64" y="65" font-size="16" letter-spacing="4" fill="#bfe88f">MODEL FOUNDRY / ENGINEERING CONTINUITY</text><text x="64" y="131" font-size="43" font-weight="700" fill="#eef5ee">改标签、换组件、调带宽，都应该产生后果。</text><text x="64" y="174" font-size="22" fill="#91aba8">把一次工程操作，连接到计算、等待、验证与交付。</text>
<g fill="#132e32" stroke="#38534f"><rect x="64" y="223" width="402" height="240" rx="12"/><rect x="519" y="223" width="402" height="240" rx="12"/><rect x="974" y="223" width="402" height="240" rx="12"/></g>
<g fill="#bfe88f" font-size="15" letter-spacing="3"><text x="89" y="263">01 / INPUT</text><text x="544" y="263">02 / EXECUTION</text><text x="999" y="263">03 / RELEASE</text></g>
<g fill="#eff5ed" font-size="27" font-weight="600"><text x="89" y="311">标签进入监督信号</text><text x="544" y="311">计算读取选定组件</text><text x="999" y="311">交付校验同一份约定</text></g>
<g fill="#9ab3af" font-size="19"><text x="89" y="355">图像 / 视频与多轮会话</text><text x="89" y="392">只监督 assistant 回答</text><text x="89" y="429">修改答案 → 损失与梯度改变</text><text x="544" y="355">Online / Target 编码器</text><text x="544" y="392">精度 / TP / PP / CP</text><text x="544" y="429">训练、评测、推理沿用选择</text><text x="999" y="355">组件、输入协议与上下文</text><text x="999" y="392">配置变更 → 重新评测与导出</text><text x="999" y="429">保留可检查的参数与产物血缘</text></g>
<path d="M478 343h28m-8-8 8 8-8 8M933 343h28m-8-8 8 8-8 8" fill="none" stroke="#bfe88f" stroke-width="2"/>
<rect x="64" y="499" width="1312" height="187" rx="12" fill="#0a1e21" stroke="#38534f"/><text x="89" y="540" font-size="16" letter-spacing="3" fill="#d4ba83">SHARED LINKS / A BARRIER HAS TO WAIT</text><text x="89" y="581" font-size="26" fill="#eef5ee">参数预取 → 前向与反向 → 梯度通信 → 优化器与同步 → 提交</text><text x="89" y="625" font-size="19" fill="#9ab3af">NVLink · IB · PCIe 共享带宽   /   并发争用   /   超时失败   /   工程存档保留剩余传输</text><text x="89" y="659" font-size="16" fill="#708f8a">通信量按目标模型张量与结构推导；执行采用微批次屏障，尚未复刻完整设备调度。</text>
<text x="64" y="737" font-size="15" letter-spacing="2" fill="#91aba8">ONE HTML. A CONNECTED ENGINEERING WORLD.</text><text x="1376" y="737" text-anchor="end" font-size="15" fill="#bfe88f">v0.15 / 2026.11</text></g></svg>
