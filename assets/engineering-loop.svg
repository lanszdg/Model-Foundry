<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 660" width="1440" height="660" role="img" aria-labelledby="t d"><title id="t">Model Foundry 工程机制闭环</title><desc id="d">原创架构示意。配置、训练、服务和故障证据由同一状态驱动，可保存与恢复。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0a1b21"/><stop offset="1" stop-color="#213e43"/></linearGradient></defs><rect width="1440" height="660" rx="24" fill="url(#b)"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="68" y="65" fill="#c5ee93" font-size="15" letter-spacing="3">MODEL FOUNDRY / ENGINEERING SYSTEMS / 0.11</text><text x="68" y="133" fill="#f0f5ee" font-size="42" font-weight="600">每次操作，都有可以追踪的工程后果。</text><text x="70" y="176" fill="#a2bcb9" font-size="19">搭环境、开发脚本、处理数据、训练调优，到部署与故障恢复。</text><g fill="#173038" stroke="#52706f"><rect x="68" y="236" width="285" height="190" rx="12"/><rect x="407" y="236" width="285" height="190" rx="12"/><rect x="746" y="236" width="285" height="190" rx="12"/><rect x="1085" y="236" width="285" height="190" rx="12"/></g><g fill="#c5ee93" font-size="13" letter-spacing="2"><text x="94" y="272">01 / BUILD</text><text x="433" y="272">02 / EXECUTE</text><text x="772" y="272">03 / INSPECT</text><text x="1111" y="272">04 / RECOVER</text></g><g fill="#eff5ef" font-size="25" font-weight="500"><text x="94" y="317">环境与源码</text><text x="433" y="317">数据与模型</text><text x="772" y="317">实验与服务</text><text x="1111" y="317">证据与恢复</text></g><g fill="#a7bfbd" font-size="15"><text x="94" y="355">venv / packages / containers</text><text x="94" y="386">files / permissions / Git</text><text x="433" y="355">partitions / ViT / adapters</text><text x="433" y="386">gradients / EMA / flow</text><text x="772" y="355">runs / metrics / artifacts</text><text x="772" y="386">queries / alerts / streams</text><text x="1111" y="355">logs / lineage / incidents</text><text x="1111" y="386">retry / restore / continue</text></g><g stroke="#c5ee93" stroke-width="2" fill="none"><path d="M353 330h54m285 0h54m285 0h54"/><pat