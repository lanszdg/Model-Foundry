<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">让每份数据，走到一次真实参数更新</title><desc id="desc">样本窗口经过多个 DP 数据副本和梯度累积，按监督 Token 加权归约，再提交优化器；检查点保留未完成的梯度和随机状态。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b2027"/><stop offset="1" stop-color="#152e32"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c4e997" stroke-opacity=".04"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b9df8d" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="650" rx="24" fill="url(#bg)"/><rect width="1440" height="650" rx="24" fill="url(#grid)"/>
<g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="64" y="67" fill="#b9df8d" font-size="14" letter-spacing="3">MODEL FOUNDRY / TRAINING EXECUTION</text><text x="64" y="126" fill="#edf4ef" font-size="38" font-weight="700">每份数据，都有走向参数的路径。</text><text x="64" y="166" fill="#9ab1b5" font-size="19">不等长样本、Padding、梯度累积与故障恢复，进入同一次可追溯的训练。</text>
<g fill="#17343b" stroke="#36545a"><rect x="64" y="228" width="270" height="236" rx="14"/><rect x="390" y="228" width="270" height="236" rx="14"/><rect x="716" y="228" width="270" height="236" rx="14"/><rect x="1042" y="228" width="334" height="236" rx="14"/></g>
<g fill="#b9df8d" font-size="13" letter-spacing="2"><text x="86" y="261">01 / SAMPLE</text><text x="412" y="261">02 / ACCUMULATE</text><text x="738" y="261">03 / REDUCE</text><text x="1064" y="261">04 / COMMIT</text></g>
<g fill="#edf4ef" font-size="23" font-weight="600"><text x="86" y="306">数据窗口与监督 Mask</text><text x="412" y="306">DP 副本逐份反向传播</text><text x="738" y="306">监督 Token 加权归约</text><text x="1064" y="306">一次优化器更新</text></g>
<g fill="#a9bdc1" font-size="17"><text x="86" y="346">记录 / Epoch / Offset</text><text x="86" y="377">输入、目标、补齐分别计数</text><text x="86" y="408">种子决定初始化与采样顺序</text><text x="412" y="346">微批量 × 累积次数 × DP</text><text x="412" y="377">每个副本持有独立梯度和权重</text><text x="412" y="408">批次齐备前，参数保持不变</text><text x="738" y="346">记录归约参与者与梯度摘要</text><text x="738" y="377">短样本不会获得过高权重</text><text x="738" y="408">Padding 不参与损失</text><text x="1064" y="346">AdamW / 主权重 / Loss scale</text><text x="1064" y="377">溢出跳过整次更新</text><text x="1064" y="408">评测与发布绑定同一份产物</text></g>
<g stroke="#b9df8d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M342 346H378"/><path d="M668 346H704"/><path d="M994 346H1030"/></g>
<rect x="64" y="514" width="1312" height="78" rx="12" fill="#223d38" stroke="#6f8c61"/><text x="88" y="546" fill="#c4e997" font-size="16" font-weight="600">CHECKPOINT / 从未完成的批次继续</text><text x="88" y="574" fill="#afc2bd" font-size="16">参数 + 优化器 + 采样游标 + 随机状态 + 累积梯度 → 校验绑定 → 恢复 → 继续计算</text></g></svg>
