<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
<defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c4ef8c" stroke-opacity=".04"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#9ec47b"/></marker></defs>
<rect width="1400" height="640" rx="16" fill="#101f23"/><rect width="1400" height="640" fill="url(#g)"/>
<g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif"><text x="60" y="62" fill="#c4ef8c" font-size="13" letter-spacing="3">MODEL FOUNDRY / SYSTEMS &amp; CLUSTER</text><text x="60" y="114" fill="#eef4e7" font-size="36" font-weight="700">每一次操作，都有系统后果。</text><text x="60" y="151" fill="#9eb4ae" font-size="17">从生效配置，到节点注册、GPU 分配与可恢复的工程状态。</text>
<g fill="#172d2e" stroke="#39554e"><rect x="60" y="204" width="380" height="294" rx="10"/><rect x="510" y="204" width="380" height="294" rx="10"/><rect x="960" y="204" width="380" height="294" rx="10"/></g>
<g fill="#c4ef8c" font-size="13" letter-spacing="2"><text x="84" y="240">01 / APPLIED CONFIG</text><text x="534" y="240">02 / RESOURCE OWNERSHIP</text><text x="984" y="240">03 / DURABLE STATE</text></g>
<g fill="#eff5e9" font-size="25" font-weight="600"><text x="84" y="282">配置保存 ≠ 进程生效</text><text x="534" y="282">32 张卡，各有归属</text><text x="984" y="282">完整提交，才能恢复</text></g>
<g font-size="15" fill="#a7bdb5"><text x="84" y="326">保存文件 → 等待加载</text><text x="84" y="360">reload → 新配置 / 原 PID</text><text x="84" y="394">restart → 新进程 / 新 PID</text><text x="84" y="450" fill="#e0be87">错误配置 → 日志与失败状态</text>
<text x="534" y="326">Munge → slurmd → 注册</text><text x="534" y="360">作业 A  [ GPU 00 — 15 ]</text><text x="534" y="394">作业 B  [ GPU 16 — 31 ]</text><text x="534" y="450" fill="#e0be87">作业 C → Resources 等待</text>
<text x="984" y="326">WRITING → 分片校验</text><text x="984" y="360">COMMITTED → 更新 latest</text><text x="984" y="394">故障中断 → ABORTED</text><text x="984" y="450" fill="#e0be87">损坏分片 → 跳过并回退</text></g>
<g fill="none" stroke="#9ec47b" stroke-width="1.5" marker-end="url(#a)"><path d="M450 350H496"/><path d="M900 350H946"/></g>
<path d="M60 550H1340" stroke="#38564e"/><text x="60" y="588" font-size="16" fill="#b6cec0">同一份工程状态</text><text x="260" y="588" font-size="14" fill="#839e94">第一人称现场  /  工具窗口  /  终端命令  /  日志与监控  /  存档与恢复</text><text x="1220" y="588" font-size="13" fill="#c4ef8c">BUILD 03</text></g>
</svg>
