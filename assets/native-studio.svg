<rect x="720" y="230" width="656" height="383" rx="14" fill="#1c2228" stroke="#465056"/><text x="748" y="268" fill="#8bc4e9" font-size="13" letter-spacing="2">02 / SOURCE INTO OBSERVABLE STATE</text><path d="M720 285h656" stroke="#3b444a"/><g font-family="Consolas,monospace" font-size="17"><text x="754" y="329" fill="#73848d">08</text><text x="802" y="329" fill="#becdd7">accumulation = global_batch // micro_batch</text><rect x="739" y="348" width="615" height="35" rx="3" fill="#78652c" fill-opacity=".5"/><circle cx="761" cy="366" r="5" fill="#e68172"/><text x="802" y="373" fill="#f0eee1">tokens = 0</text><text x="754" y="412" fill="#73848d">10</text><text x="802" y="412" fill="#a8cde6">for step in range(accumulation):</text></g><path d="M744 442h608" stroke="#3d484e"/><text x="750" y="475" fill="#8bc4e9" font-size="12" letter-spacing="2">VARIABLES</text><text x="1026" y="475" fill="#8bc4e9" font-size="12" letter-spacing="2">WATCH</text><g fill="#c1d0d5" font-family="Consolas,monospace" font-size="15"><text x="750" y="510">global_batch     8</text><text x="750" y="540">micro_batch      2</text><text x="750" y="570">accumulation     4</text><text x="1026" y="510">global_batch /</text><text x="1026" y="540">micro_batch = 4</text></g>
