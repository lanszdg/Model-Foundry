<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
<title id="title">省下的显存，有可追踪的执行过程</title><desc id="desc">ZeRO从复制优化器、梯度和参数，逐步变成各rank持有自己的分片。参数按需聚合和释放，激活在反向时重算。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10252b"/><stop offset="1" stop-color="#1c3638"/></linearGradient></defs><rect width="1440" height="610" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="64" y="65" fill="#bfe594" font-size="14" letter-spacing="3">MODEL FOUNDRY / RANK OWNERSHIP</text><text x="64" y="122" fill="#eff5ed" font-size="38" font-weight="700">省下的显存，有可追踪的执行过程。</text><text x="64" y="165" fill="#a9bec0" font-size="19">状态归属、数值通信、参数释放与激活回放，成为同一次训练的记录。</text>
<g fill="#173239" stroke="#486066"><rect x="64" y="216" width="305" height="244" rx="12"/><rect x="400" y="216" width="305" height="244" rx="12"/><rect x="736" y="216" width="305" height="244" rx="12"/><rect x="1072" y="216" width="304" height="244" rx="12"/></g>
<g fill="#c3e797" font-size="16" letter-spacing="2"><text x="88" y="250">ZERO 0</text><text x="424" y="250">ZERO 1</text><text x="760" y="250">ZERO 2</text><text x="1096" y="250">ZERO 3</text></g>
<g fill="#ecf3ee" font-size="23" font-weight="600"><text x="88" y="291">每卡复制训练状态</text><text x="424" y="291">优化器分片</text><text x="760" y="291">再分片梯度</text><text x="1096" y="291">再分片参数</text></g>
<g font-size="16"><g fill="#a9bec0"><text x="88" y="333">参数 W</text><text x="88" y="376">梯度 G</text><text x="88" y="419">主权重 / M / V</text><text x="424" y="333">参数 W</text><text x="424" y="376">梯度 G</text><text x="424" y="419">主权重 / M / V</text><text x="760" y="333">参数 W</text><text x="760" y="376">梯度 G</text><text x="760" y="419">主权重 / M / V</text><text x="1096" y="333">参数 W</text><text x="1096" y="376">梯度 G</text><text x="1096" y="419">主权重 / M / V</text></g><g fill="#bfe594"><rect x="205" y="315" width="140" height="23" rx="4"/><rect x="205" y="358" width="140" height="23" rx="4"/><rect x="205" y="401" width="140" height="23" rx="4"/><rect x="541" y="315" width="140" height="23" rx="4"/><rect x="541" y="358" width="140" height="23" rx="4"/><rect x="541" y="401" width="35" height="23" rx="4"/><rect x="877" y="315" width="140" height="23" rx="4"/><rect x="877" y="358" width="35" height="23" rx="4"/><rect x="877" y="401" width="35" height="23" rx="4"/><rect x="1213" y="315" width="35" height="23" rx="4"/><rect x="1213" y="358" width="35" height="23" rx="4"/><rect x="1213" y="401" width="35" height="23" rx="4"/></g></g>
<rect x="64" y="502" width="1312" height="60" rx="10" fill="#2b463d" stroke="#6f8c63"/><text x="88" y="539" fill="#d9eac8" font-size="18">按需聚合参数 → 前向 → 释放 → 反向重算与聚合 → 梯度归约分片 → Rank 本地 AdamW → 检查点</text><text x="64" y="591" fill="#8fa5a6" font-size="13">示意为四副本均分。实际分片记录保留张量索引、DP / CP / PP / TP 位置、梯度摘要与缓冲元素数量。</text></g></svg>
