<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc"><title id="title">Model Foundry · Distributed execution</title><desc id="desc">GPU 进程通过流水线和通信依赖完成整批训练，所有梯度准备完成后才提交参数更新。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122b35"/><stop offset="1" stop-color="#102027"/></linearGradient></defs><rect width="1440" height="590" rx="18" fill="url(#bg)"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="64" y="52" fill="#b7d991" font-size="12" letter-spacing="3">MODEL FOUNDRY / DISTRIBUTED EXECUTION 06</text><text x="64" y="105" fill="#eff5ec" font-size="32" font-weight="600">从一个作业，走到每一张 GPU。</text><text x="64" y="140" fill="#a3b7b4" font-size="16">Micro batch · Pipeline · Shared links · Global optimizer barrier</text><g fill="#193640" stroke="#3e5d64"><rect x="64" y="185" width="940" height="278" rx="10"/><rect x="1040" y="185" width="336" height="278" rx="10"/></g><g fill="#91acae" font-size="12"><text x="86" y="217">PIPELINE / DEPENDENCY VIEW</text><text x="1064" y="217">COMMIT CONTRACT</text></g><g fill="#c9d8cf" font-size="14"><text x="86" y="263">PP 0</text><text x="86" y="312">PP 1</text><text x="86" y="361">PP 2</text><text x="86" y="410">PP 3</text></g><g stroke="#42606a" stroke-dasharray="4 6"><path d="M162 270H976M162 319H976M162 368H976M162 417H976"/></g><g fill="#78a97e"><rect x="162" y="242" width="94" height="29" rx="3"/><rect x="263" y="242" width="94" height="29" rx="3"/><rect x="364" y="242" width="94" height="29" rx="3"/><rect x="263" y="291" width="94" height="29" rx="3"/><rect x="364" y="291" width="94" height="29" rx="3"/><rect x="364" y="340" width="94" height="29" rx="3"/><rect x="465" y="389" width="94" height="29" rx="3"/></g><g fill="#6194bb"><rect x="768" y="242" width="94" height="29" rx="3"/><rect x="667" y="291" width="94" height="29" rx="3"/><rect x="566" y="340" width="94" height="29" rx="3"/><rect x="566" y="389" width="94" height="29" rx="3"/></g><g fill="#182d2c" font-size="11"><text x="192" y="261">F 0</text><text x="293" y="261">F 1</text><text x="394" y="261">F 2</text><text x="293" y="310">F 0</text><text x="394" y="310">F 1</text><text x="394" y="359">F 0</text><text x="495" y="408">F 0</text></g><g fill="#f0f6f4" font-size="11"><text x="797" y="261">B 0</text><text x="696" y="310">B 0</text><text x="595" y="359">B 0</text><text x="595" y="408">B 0</text></g><g fill="#b9d5a5" font-size="16"><text x="1064" y="258">01  完整的 micro batch 梯度</text><text x="1064" y="301">02  ReduceScatter / 全局范数</text><text x="1064" y="344">03  Adam / 参数同步</text><text x="1064" y="387">04  模型、RNG 与游标提交</text></g><text x="1064" y="435" fill="#8fa9aa" font-size="12">未完成的步骤，不改变已提交状态。</text><rect x="64" y="496" width="1312" height="50" rx="7" fill="#afce92" fill-opacity=".09"/><text x="86" y="526" fill="#bdd4b0" font-size="14">单卡降速 → 同组等待　　断开 IB → 相关通信阻塞　　完整检查点 → 精确续接　　同一份状态，贯穿现场与工具。</text><text x="64" y="574" fill="#6f8c90" font-size="10">架构示意；应用时间线由当前工程的执行事件生成。</text></g></svg>
