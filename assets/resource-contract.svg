<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520"><defs><linearGradient id="g"><stop stop-color="#102b32"/><stop offset="1" stop-color="#183e43"/></linearGradient></defs><rect width="1440" height="520" rx="20" fill="url(#g)"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="64" y="67" fill="#bce68f" font-size="15" letter-spacing="4">MODEL FOUNDRY / TENSOR CONTRACTS</text><text x="64" y="124" fill="#f4f8f5" font-size="37" font-weight="700">每一次资源决策，都能追溯到张量。</text><text x="64" y="165" fill="#a2bbbc" font-size="18">官方固定版本 → 完整命名清单 → 逐卡归属 → 启动检查 → 绑定发布</text><g fill="#24474c" stroke="#527376"><rect x="64" y="218" width="292" height="192" rx="12"/><rect x="401" y="218" width="292" height="192" rx="12"/><rect x="738" y="218" width="292" height="192" rx="12"/><rect x="1075" y="218" width="301" height="192" rx="12"/></g><g fill="#bce68f" font-size="13" letter-spacing="2"><text x="88" y="253">01 / SOURCE</text><text x="425" y="253">02 / OWNERSHIP</text><text x="762" y="253">03 / RESIDENCY</text><text x="1099" y="253">04 / RELEASE</text></g><g fill="#f0f6f3" font-size="22" font-weight="700"><text x="88" y="294">221,493 个来源张量</text><text x="425" y="294">TP · PP · CP · DP · EP</text><text x="762" y="294">权重与状态分别计量</text><text x="1099" y="294">评测与产物绑定</text></g><g fill="#b7cccb" font-size="16"><text x="88" y="335">名称 / 形状 / 精度 / 分片</text><text x="88" y="366">源版本、文件头摘要可追溯</text><text x="425" y="335">ZeRO 状态与专家归属</text><text x="425" y="366">没有核实的算子保留副本</text><text x="762" y="335">主权重 / 梯度 / Adam / KV</text><text x="762" y="366">CPU 卸载按实际主机汇总</text><text x="1099" y="335">模型 / 数据 / 精度 / Processor</text><text x="1099" y="366">变化后重新评测，避免旧报告</text></g><g fill="#bce68f" font-size="28"><text x="368" y="320">→</text><text x="705" y="320">→</text><text x="1042" y="320">→</text></g><text x="64" y="467" fill="#8da9a9" font-size="15">七条开放模型路线。元数据内联 HTML；激活与算子工作区仍采用有记录的解析估算。</text></g></svg>
